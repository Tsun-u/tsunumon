[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsunumon"
version = "0.1.0"
description = "Teaching Monster Challenge - AI Agent for generating educational videos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "anthropic>=0.40.0",
    "Pillow>=10.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
    "playwright>=1.40.0",
    "kokoro-onnx>=0.4.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
